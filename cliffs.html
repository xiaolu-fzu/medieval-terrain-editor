<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>悬崖 · 四种形态</title>
<style>
  :root{--amber:#f5b942;--text:#e8e9ec;--muted:#9aa0ab;--panel:#151a21;--line:#2a2f38;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0c0f14;color:var(--text);padding:24px;}
  h1{font-size:18px;margin-bottom:6px;} h1 .dot{color:var(--amber);}
  p.sub{font-size:12px;color:var(--muted);margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:920px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .card h3{font-size:13px;margin-bottom:10px;color:var(--amber);}
  .rows{background:#0e1a24;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:center;}
  .rows .lbl{font-size:11px;color:var(--muted);align-self:flex-start;}
  .pair{display:flex;align-items:flex-end;gap:2px;}
  .pair img{display:block;image-rendering:pixelated;width:64px;height:64px;}
  .note{font-size:11px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<h1>悬崖 <span class="dot">·</span> 四种形态（草唇顶 + 崖壁）</h1>
<p class="sub">每列一种悬崖段位：左端 / 中间 / 右端 / 窄 · 上下两行=草唇顶 + 崖壁（落地/落水）</p>
<div class="grid">
  <div class="card"><h3>① 左端</h3>
    <div class="rows"><span class="lbl">草唇顶</span><img src="assets/cliffs/lip_left.png"></div>
    <div class="rows"><span class="lbl">崖壁·落地</span><img src="assets/cliffs/cliff_land_left.png"></div>
    <div class="rows"><span class="lbl">崖壁·落水</span><img src="assets/cliffs/cliff_water_left.png"></div>
    <div class="note">西侧开放（左端收圆）</div>
  </div>
  <div class="card"><h3>② 中间</h3>
    <div class="rows"><span class="lbl">草唇顶</span><img src="assets/cliffs/lip_mid.png"></div>
    <div class="rows"><span class="lbl">崖壁·落地</span><img src="assets/cliffs/cliff_land_mid.png"></div>
    <div class="rows"><span class="lbl">崖壁·落水</span><img src="assets/cliffs/cliff_water_mid.png"></div>
    <div class="note">两侧连续（齐平）</div>
  </div>
  <div class="card"><h3>③ 右端</h3>
    <div class="rows"><span class="lbl">草唇顶</span><img src="assets/cliffs/lip_right.png"></div>
    <div class="rows"><span class="lbl">崖壁·落地</span><img src="assets/cliffs/cliff_land_right.png"></div>
    <div class="rows"><span class="lbl">崖壁·落水</span><img src="assets/cliffs/cliff_water_right.png"></div>
    <div class="note">东侧开放（右端收圆）</div>
  </div>
  <div class="card"><h3>④ 窄</h3>
    <div class="rows"><span class="lbl">草唇顶</span><img src="assets/cliffs/lip_narrow.png"></div>
    <div class="rows"><span class="lbl">崖壁·落地</span><img src="assets/cliffs/cliff_land_narrow.png"></div>
    <div class="rows"><span class="lbl">崖壁·落水</span><img src="assets/cliffs/cliff_water_narrow.png"></div>
    <div class="note">孤立 / 1格宽</div>
  </div>
</div>
</body>
</html>
